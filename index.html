<style>
:root{--black:#111;--white:#fff;--gray:#f5f5f5;--gray2:#e8e8e8;--gray3:#999;--sidebar:220px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter Tight',sans-serif;background:#f0f0f0;color:var(--black);min-height:100vh;display:flex}
#sidebar{width:var(--sidebar);background:var(--black);color:var(--white);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;padding:0}
#sidebar .logo-wrap{padding:28px 24px 20px;border-bottom:1px solid #333}
#sidebar .logo-wrap img{width:100%;max-width:140px;filter:invert(1)}
#sidebar nav{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 24px;cursor:pointer;font-size:13px;font-weight:500;color:#bbb;transition:all .15s;border:none;background:none;width:100%;text-align:left;letter-spacing:.3px}
.nav-item:hover{color:#fff;background:#222}
.nav-item.active{color:#fff;background:#222}
.nav-item svg{width:16px;height:16px;opacity:.7}
.nav-item.active svg{opacity:1}
#main{margin-left:var(--sidebar);flex:1;padding:36px 40px;min-height:100vh}
.page{display:none}.page.active{display:block}
h1{font-size:22px;font-weight:700;margin-bottom:24px;letter-spacing:-.3px}
h2{font-size:16px;font-weight:600;margin-bottom:16px}
.card{background:#fff;border-radius:10px;padding:28px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:7px;font-family:'Inter Tight',sans-serif;font-size:14px;color:var(--black);background:#fff;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:#aaa}
textarea{resize:vertical;min-height:60px}
.row{display:grid;gap:16px;margin-bottom:16px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:7px;font-family:'Inter Tight',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;letter-spacing:.2px}
.btn-primary{background:var(--black);color:#fff}.btn-primary:hover{background:#333}
.btn-secondary{background:#fff;color:var(--black);border:1.5px solid #ddd}.btn-secondary:hover{background:#f5f5f5}
.btn-danger{background:#fee;color:#c00;border:1.5px solid #fcc}.btn-danger:hover{background:#fdd}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
/* toggle group */
.toggle-group{display:flex;gap:3px;background:#f0f0f0;border-radius:8px;padding:3px}
.toggle-btn{padding:5px 11px;border-radius:6px;font-family:'Inter Tight',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:#666;transition:all .15s}
.toggle-btn.active{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.li-table{width:100%;border-collapse:collapse;margin-top:8px}
.li-table th{font-size:11px;font-weight:600;color:#999;text-align:left;padding:6px 8px;border-bottom:2px solid #eee;letter-spacing:.4px;text-transform:uppercase}
.li-table td{padding:6px 4px;vertical-align:top}
.li-table td input{padding:7px 8px;font-size:13px}
.section-block{background:#f9f9f9;border:1.5px solid #eee;border-radius:8px;padding:20px;margin-bottom:16px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-title-input{font-size:15px;font-weight:700;border:none;background:transparent;padding:0;width:auto;flex:1;min-width:100px}
.section-title-input:focus{outline:none;border-bottom:2px solid #aaa;border-radius:0}
.mode-pill{display:inline-flex;border-radius:6px;overflow:hidden;border:1.5px solid #e0e0e0;flex-shrink:0}
.mode-pill button{padding:4px 10px;font-family:'Inter Tight',sans-serif;font-size:11px;font-weight:600;cursor:pointer;border:none;background:#fff;color:#999;transition:all .15s}
.mode-pill button.active{background:#111;color:#fff}
.activity-list{list-style:none;padding:0;margin:0}
.activity-item{display:flex;align-items:center;gap:6px;padding:4px 0}
.activity-item input{flex:1;padding:6px 10px;font-size:13px}
.activity-item button{background:none;border:none;cursor:pointer;color:#c00;font-size:18px;padding:0 4px;flex-shrink:0}
.totals-block{background:#fff;border:1.5px solid #eee;border-radius:8px;padding:16px 20px;margin-top:16px}
.totals-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px;border-bottom:1px solid #f0f0f0}
.totals-row:last-child{border:none;font-weight:700;font-size:16px;margin-top:4px;padding-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-card .label{font-size:11px;font-weight:600;color:#999;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.stat-card .value{font-size:26px;font-weight:700;letter-spacing:-.5px}
.stat-card .value.small{font-size:20px}
.quote-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .1s;border-radius:7px}
.quote-item:hover{background:#f9f9f9}
.quote-item .qi-left .num{font-weight:700;font-size:14px}
.quote-item .qi-left .client{font-size:12px;color:#888;margin-top:2px}
.quote-item .qi-right{display:flex;align-items:center;gap:16px}
.qi-amt{font-weight:700;font-size:15px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge-draft{background:#f0f0f0;color:#666}
.badge-sent{background:#e8f0fe;color:#1a73e8}
.badge-approved{background:#e6f4ea;color:#137333}
.badge-rejected{background:#fce8e6;color:#c5221f}
.alert{padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:12px;display:none}
.alert.err{background:#fee;color:#c00;border:1px solid #fcc}
.alert.ok{background:#e6f4ea;color:#137333;border:1px solid #c6e8cc}
</style>
</head>

<div id="main">

  <!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <h1>Cotizaciones</h1>
    <div class="stats">
      <div class="stat-card"><div class="label">Total</div><div class="value" id="stat-total">0</div></div>
      <div class="stat-card"><div class="label">Borradores</div><div class="value" id="stat-draft">0</div></div>
      <div class="stat-card"><div class="label">Aprobadas</div><div class="value" id="stat-approved">0</div></div>
      <div class="stat-card"><div class="label">Valor aprobado</div><div class="value small" id="stat-value">$0</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="margin:0">Recientes</h2>
        <button class="btn btn-primary btn-sm" onclick="nav('new-quote',{reset:true})">+ Nueva</button>
      </div>
      <div id="quotes-list"><p style="color:#999;font-size:14px">Cargando...</p></div>
    </div>
  </div>

  <!-- NEW QUOTE -->
  <div class="page" id="page-new-quote">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <h1 style="margin:0" id="form-title">Nueva Cotización</h1>
      <span id="quote-num-badge" style="background:#f0f0f0;border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700;color:#666"></span>
    </div>
    <div id="nq-alert" class="alert"></div>
    <div class="card">
      <h2>Información general</h2>
      <div class="row c3">
        <div><label>Cliente</label><select id="q-client"><option value="">Seleccionar cliente...</option></select></div>
        <div><label>Fecha de emisión</label><input type="date" id="q-date"></div>
        <div><label>Válida hasta</label><input type="date" id="q-valid-until"></div>
      </div>
      <div class="row c3">
        <div><label>Título / Proyecto</label><input type="text" id="q-title" placeholder="Ej: Campaña digital Q3 2026"></div>
        <div><label>Estado</label><select id="q-status">
          <option value="draft">Borrador</option>
          <option value="sent">Enviada</option>
          <option value="approved">Aprobada</option>
          <option value="rejected">Rechazada</option>
        </select></div>
        <div>
          <label>Divisa</label>
          <select id="q-currency" onchange="currencyChanged()">
            <option value="USD">USD — Dólar</option>
            <option value="EUR">EUR — Euro</option>
            <option value="MXN">MXN — Peso mexicano</option>
          </select>
        </div>
      </div>
      <div><label>Notas / Condiciones</label><textarea id="q-notes" placeholder="Condiciones de pago, alcances, etc." rows="3"></textarea></div>
    </div>
    <div id="sections-container"></div>
    <button class="btn btn-secondary" onclick="addSection()" style="margin-bottom:20px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Agregar sección
    </button>
    <div class="card">
      <div class="totals-block">
        <div class="totals-row"><span>Subtotal</span><span id="q-sub">—</span></div>
        <div class="totals-row">
          <span>Descuento</span>
          <div style="display:flex;align-items:center;gap:8px">
            <input type="number" id="q-discount" value="0" min="0" style="width:80px;text-align:right" oninput="calcTotals()">
            <span id="disc-currency-label" style="font-size:12px;color:#999">USD</span>
          </div>
        </div>
        <div class="totals-row">
          <span>Impuestos (%)</span>
          <div style="display:flex;align-items:center;gap:8px">
            <input type="number" id="q-tax" value="0" min="0" style="width:80px;text-align:right" oninput="calcTotals()">
            <span style="font-size:12px;color:#999">%</span>
          </div>
        </div>
        <div class="totals-row"><span>TOTAL</span><span id="q-total" style="font-size:18px">—</span></div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="saveQuote(false)">Guardar cotización</button>
      <button class="btn btn-secondary" onclick="saveQuote(true)">Guardar borrador</button>
      <button class="btn btn-secondary" onclick="previewQuote()">Vista previa</button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="page" id="page-preview">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-secondary btn-sm" onclick="nav('new-quote')">← Editar</button>
        <h1 style="margin:0">Vista Previa</h1>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <!-- Lang toggle -->
        <div class="toggle-group">
          <button class="toggle-btn active" id="lang-es" onclick="setLang('es')">ES</button>
          <button class="toggle-btn" id="lang-en" onclick="setLang('en')">EN</button>
        </div>
        <!-- Currency toggle -->
        <div class="toggle-group">
          <button class="toggle-btn active" id="curr-USD" onclick="setPreviewCurrency('USD')">USD</button>
          <button class="toggle-btn" id="curr-EUR" onclick="setPreviewCurrency('EUR')">EUR</button>
          <button class="toggle-btn" id="curr-MXN" onclick="setPreviewCurrency('MXN')">MXN</button>
        </div>
        <button class="btn btn-primary btn-sm" onclick="downloadPDF()">⬇ Descargar PDF</button>
      </div>
    </div>
    <div id="preview-container" style="background:#fff;border-radius:10px;overflow:hidden"></div>
  </div>

  <!-- CLIENTS -->
  <div class="page" id="page-clients">
    <h1>Clientes</h1>
    <div class="card">
      <h2>Nuevo cliente</h2>
      <div class="row c2">
        <div><label>Nombre</label><input type="text" id="c-name" placeholder="Nombre del cliente"></div>
        <div><label>Empresa</label><input type="text" id="c-company" placeholder="Empresa (opcional)"></div>
      </div>
      <div class="row c2">
        <div><label>Email</label><input type="email" id="c-email"></div>
        <div><label>Dirección</label><input type="text" id="c-addr"></div>
      </div>
      <button class="btn btn-primary" onclick="saveClient()">Guardar cliente</button>
    </div>
    <div class="card"><div id="clients-list"><p style="color:#999;font-size:14px">Cargando...</p></div></div>
  </div>

  <!-- SETTINGS -->
  <div class="page" id="page-settings">
    <h1>Ajustes</h1>
    <div class="card">
      <h2>Información de la empresa</h2>
      <div class="row c2">
        <div><label>Nombre / Marca</label><input type="text" id="s-brand" placeholder="lmnto"></div>
        <div><label>Email</label><input type="email" id="s-email"></div>
      </div>
      <div class="row c2">
        <div><label>Teléfono</label><input type="text" id="s-phone"></div>
        <div><label>Sitio web</label><input type="text" id="s-web"></div>
      </div>
      <div><label>Dirección</label><input type="text" id="s-addr"></div>
    </div>
    <div class="card">
      <h2>Numeración</h2>
      <div class="row c2">
        <div><label>Siguiente número</label><input type="number" id="s-next-num" min="1"></div>
        <div><label>Prefijo</label><input type="text" id="s-prefix" placeholder="Q-"></div>
      </div>
      <button class="btn btn-primary" onclick="saveSettings()">Guardar ajustes</button>
    </div>
  </div>

</div>

<script type="module">

// Currency config
const CURRENCIES = {
  USD: { symbol: '$', code: 'USD', locale: 'en-US' },
  EUR: { symbol: '€', code: 'EUR', locale: 'de-DE' },
  MXN: { symbol: '$', code: 'MXN', locale: 'es-MX' }
};

function fmtMoney(amount, cur) {
  const c = CURRENCIES[cur] || CURRENCIES.USD;
  return `${c.code} ${c.symbol}${Number(amount).toFixed(2)}`;
}

// ── INIT ──
async function init() {
  await loadSettings();
  await loadClients();
  await loadQuotes();
  initNewQuote();
  renderDashboard();
  document.getElementById('s-next-num').value = settings.nextNum||1;
  document.getElementById('s-prefix').value = settings.prefix||'Q-';
  document.getElementById('s-brand').value = settings.brand||'';
  document.getElementById('s-email').value = settings.email||'';
  document.getElementById('s-phone').value = settings.phone||'';
  document.getElementById('s-web').value = settings.web||'';
  document.getElementById('s-addr').value = settings.addr||'';
  updateLangButtons();
  updatePreviewCurrencyButtons();
}

async function loadSettings() {
  try { const s=await getDoc(doc(db,'config','quote_settings')); if(s.exists()) settings={...settings,...s.data()}; } catch(e){}
}

async function loadClients() {
  try {
    const snap = await getDocs(collection(db,'clients'));
    clients = snap.docs.map(d=>({id:d.id,...d.data()}));
    const sel = document.getElementById('q-client');
    sel.innerHTML = '<option value="">Seleccionar cliente...</option>';
    clients.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.company?`${c.name} — ${c.company}`:c.name; sel.appendChild(o); });
  } catch(e){}
}

async function loadQuotes() {
  try { const s=await getDocs(query(collection(db,'quotes'),orderBy('createdAt','desc'),limit(50))); quotes=s.docs.map(d=>({id:d.id,...d.data()})); } catch(e){}
}

// ── NAVIGATION ──
window.nav = function(page, opts={}) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  const items=document.querySelectorAll('.nav-item');
  const map={dashboard:0,'new-quote':1,clients:2,settings:3};
  if(map[page]!==undefined) items[map[page]].classList.add('active');
  if(page==='new-quote'&&opts.reset){editingQuoteId=null;initNewQuote();}
  if(page==='dashboard') renderDashboard();
  if(page==='clients') renderClients();
  window.scrollTo(0,0);
};

function initNewQuote() {

  document.getElementById('form-title').textContent='Nueva Cotización';
  document.getElementById('quote-num-badge').textContent='#'+String(settings.nextNum||1).padStart(4,'0');
  const today=new Date().toISOString().split('T')[0];
  const valid=new Date(Date.now()+30*86400000).toISOString().split('T')[0];
  document.getElementById('q-date').value=today;
  document.getElementById('q-valid-until').value=valid;
  document.getElementById('q-client').value='';

  document.getElementById('q-tax').value='0';

function updatePreviewCurrencyButtons() {
  ['USD','EUR','MXN'].forEach(c=>{

    if(!b) return;
    b.classList.toggle('active', c===previewCurrency);
  });
}

  lang=l; localStorage.setItem('lmnto_q_lang',l);
  updateLangButtons();

};
function updateLangButtons() {
  ['es','en'].forEach(code=>{

  });
}

// ── SECTIONS ──
window.addSection = function() {
  sections.push({id:'s'+Date.now(),title:'Nueva sección',mode:'bundle',price:0,activities:[''],items:[{desc:'',qty:1,rate:0,amt:0}]});
  renderSections();
};

window.toggleSectionMode = function(sid, mode) {
  const s=sections.find(s=>s.id===sid);
  if(s){ s.mode=mode; renderSections(); calcTotals(); }
};

window.activityEv = function(el) {
  const sid=el.dataset.sid, idx=parseInt(el.dataset.idx);
  const s=sections.find(s=>s.id===sid);
  if(s) s.activities[idx]=el.value;
};

window.addActivity = function(sid) {
  const s=sections.find(s=>s.id===sid);
  if(s){ s.activities.push(''); renderSections(); }
};

window.removeActivity = function(sid, idx) {
  const s=sections.find(s=>s.id===sid);
  if(s&&s.activities.length>1){ s.activities.splice(idx,1); renderSections(); }
};

window.bundlePriceEv = function(el) {
  const sid=el.dataset.sid;
  const s=sections.find(s=>s.id===sid);
  if(s){ s.price=parseFloat(el.value)||0; calcTotals(); }
};
window.removeSection = function(sid) {
  sections=sections.filter(s=>s.id!==sid);
  renderSections(); calcTotals();
};
window.addItem = function(sid) {
  const s=sections.find(s=>s.id===sid);
  if(s){s.items.push({desc:'',qty:1,rate:0,amt:0});renderSections();}
};
window.removeItem = function(sid,idx) {
  const s=sections.find(s=>s.id===sid);
  if(s&&s.items.length>1){s.items.splice(idx,1);renderSections();calcTotals();}
};
window.liEv = function(el) {
  const sid=el.dataset.sid, idx=parseInt(el.dataset.idx), field=el.dataset.field;
  const s=sections.find(s=>s.id===sid);
  if(!s) return;
  s.items[idx][field]=el.value;
  if(field==='qty'||field==='rate'){
    const r=parseFloat(s.items[idx].rate)||0, q=parseFloat(s.items[idx].qty)||0;
    s.items[idx].amt=(r*q).toFixed(2);
    const el2=document.getElementById('amt-'+sid+'-'+idx);
    if(el2) el2.value=s.items[idx].amt;
  }
  calcTotals();
};
window.secTitleEv = function(el) {
  const s=sections.find(s=>s.id===el.dataset.sid);
  if(s) s.title=el.value;
};

function renderSections() {
  const cont=document.getElementById('sections-container');
  cont.innerHTML=sections.map(s=>{
    const mode=s.mode||'bundle';
    const modePill=`<div class="mode-pill">
      <button class="${mode==='bundle'?'active':''}" onclick="toggleSectionMode('${s.id}','bundle')">Precio global</button>
      <button class="${mode==='itemized'?'active':''}" onclick="toggleSectionMode('${s.id}','itemized')">Desglose</button>
    </div>`;
    const removeBtn=sections.length>1?`<button class="btn btn-danger btn-sm" onclick="removeSection('${s.id}')">✕</button>`:'';

    let body='';
    if(mode==='bundle'){
      const acts=(s.activities||['']).map((a,i)=>`
        <div class="activity-item">
          <span style="color:#bbb;font-size:14px;flex-shrink:0">•</span>
          <input type="text" value="${escH(a)}" data-sid="${s.id}" data-idx="${i}" oninput="activityEv(this)" placeholder="Actividad incluida...">
          ${(s.activities||[]).length>1?`<button onclick="removeActivity('${s.id}',${i})">×</button>`:''}
        </div>`).join('');
      body=`<div style="display:flex;align-items:flex-start;gap:20px;margin-top:4px">
        <div style="flex:1">
          <p style="font-size:11px;font-weight:600;color:#999;letter-spacing:.3px;text-transform:uppercase;margin-bottom:8px">Actividades incluidas</p>
          <div class="activity-list">${acts}</div>
          <button class="btn btn-secondary btn-sm" style="margin-top:10px" onclick="addActivity('${s.id}')">+ Actividad</button>
        </div>
        <div style="flex-shrink:0;min-width:180px">
          <p style="font-size:11px;font-weight:600;color:#999;letter-spacing:.3px;text-transform:uppercase;margin-bottom:8px">Precio</p>
          <input type="number" value="${s.price||''}" data-sid="${s.id}" oninput="bundlePriceEv(this)" min="0" step="0.01" placeholder="0.00" style="text-align:right">
          <p style="text-align:right;margin-top:6px;font-size:13px;font-weight:600;color:#555">= <span id="sec-sub-${s.id}">—</span></p>
        </div>
      </div>`;
    } else {
      const rows=(s.items||[]).map((it,i)=>`
        <tr>
          <td><input type="text" value="${escH(it.desc||'')}" data-sid="${s.id}" data-idx="${i}" data-field="desc" oninput="liEv(this)" placeholder="Descripción..."></td>
          <td><input type="number" value="${it.qty||''}" data-sid="${s.id}" data-idx="${i}" data-field="qty" oninput="liEv(this)" min="0" step="0.5"></td>
          <td><input type="number" value="${it.rate||''}" data-sid="${s.id}" data-idx="${i}" data-field="rate" oninput="liEv(this)" min="0" step="0.01"></td>
          <td><input type="number" id="amt-${s.id}-${i}" value="${it.amt||''}" data-sid="${s.id}" data-idx="${i}" data-field="amt" oninput="liEv(this)" min="0" step="0.01"></td>
          <td style="width:36px;text-align:center">${s.items.length>1?`<button onclick="removeItem('${s.id}',${i})" style="background:none;border:none;cursor:pointer;color:#c00;font-size:16px;padding:0 4px">×</button>`:''}</td>
        </tr>`).join('');
      body=`<table class="li-table">
        <thead><tr>
          <th style="width:44%">Descripción</th>
          <th style="width:14%">Qty / Hrs</th>
          <th style="width:18%">Precio unit.</th>
          <th style="width:18%">Monto</th>
          <th style="width:6%"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0 0">
        <button class="btn btn-secondary btn-sm" onclick="addItem('${s.id}')">+ Línea</button>
        <span style="font-size:13px;font-weight:600;color:#555">Sección: <span id="sec-sub-${s.id}">—</span></span>
      </div>`;
    }

    return `<div class="section-block" id="sb-${s.id}">
      <div class="section-header">
        <input class="section-title-input" type="text" value="${escH(s.title)}" placeholder="Nombre de sección" data-sid="${s.id}" oninput="secTitleEv(this)">
        <div style="display:flex;gap:8px;align-items:center">
          ${modePill}
          ${removeBtn}
        </div>
      </div>
      ${body}
    </div>`;
  }).join('');
  calcTotals();
}

function calcTotals() {
  const cur = document.getElementById('q-currency')?.value || currency;
  let sub=0;
  sections.forEach(s=>{
    let ss=0;
    if((s.mode||'bundle')==='bundle'){
      ss=parseFloat(s.price)||0;
    } else {
      s.items.forEach((it,i)=>{const el=document.getElementById('amt-'+s.id+'-'+i);ss+=el?parseFloat(el.value)||0:parseFloat(it.amt)||0;});
    }
    sub+=ss;
    const secEl=document.getElementById('sec-sub-'+s.id);
    if(secEl) secEl.textContent=fmtMoney(ss,cur);
  });
  const disc=parseFloat(document.getElementById('q-discount').value)||0;
  const taxPct=parseFloat(document.getElementById('q-tax').value)||0;
  const afterDisc=Math.max(0,sub-disc);
  const total=afterDisc+afterDisc*taxPct/100;
  document.getElementById('q-sub').textContent=fmtMoney(sub,cur);
  document.getElementById('q-total').textContent=fmtMoney(total,cur);
}
window.calcTotals=calcTotals;

// ── SAVE ──
window.saveQuote = async function(isDraft=false) {
  const clientId=document.getElementById('q-client').value;
  if(!isDraft&&!clientId){showAlert('nq-alert','Selecciona un cliente.','err');return;}
  const numToUse=settings.nextNum||1;
  const prefix=settings.prefix||'Q-';
  const cur=document.getElementById('q-currency').value||'USD';
  let sub=0;
  const secs=sections.map(s=>{
    const mode=s.mode||'bundle';
    if(mode==='bundle'){
      sub+=parseFloat(s.price)||0;
      return {...s,mode,price:parseFloat(s.price)||0,activities:s.activities||[]};
    } else {
      const items=s.items.map((it,i)=>{const el=document.getElementById('amt-'+s.id+'-'+i);const amt=el?parseFloat(el.value)||0:parseFloat(it.amt)||0;sub+=amt;return {...it,amt};});
      return {...s,mode,items};
    }
  });
  const disc=parseFloat(document.getElementById('q-discount').value)||0;
  const taxPct=parseFloat(document.getElementById('q-tax').value)||0;
  const afterDisc=Math.max(0,sub-disc);
  const total=afterDisc+afterDisc*taxPct/100;
  const client=clients.find(c=>c.id===clientId)||{name:'',company:'',addr:'',email:''};
  const data={
    number: isDraft?(editingQuoteId?undefined:'DRAFT-'+Date.now()):`${prefix}${String(numToUse).padStart(4,'0')}`,
    clientId,clientName:client.name,clientCompany:client.company||'',clientAddr:client.addr||'',clientEmail:client.email||'',
    title:document.getElementById('q-title').value,
    date:document.getElementById('q-date').value,
    validUntil:document.getElementById('q-valid-until').value,
    notes:document.getElementById('q-notes').value,
    status:isDraft?'draft':document.getElementById('q-status').value,
    currency:cur,
    sections:secs,subtotal:sub,discount:disc,taxPct,total,createdAt:Date.now()
  };
  if(!data.number) delete data.number;
  try {
    const qid=editingQuoteId||'q'+Date.now();
    await setDoc(doc(db,'quotes',qid),data);
    if(!isDraft&&!editingQuoteId){settings.nextNum=numToUse+1;await setDoc(doc(db,'config','quote_settings'),settings);}
    editingQuoteId=qid;
    Object.assign(data,{id:qid});
    const idx=quotes.findIndex(q=>q.id===qid);
    if(idx>=0) quotes[idx]=data; else quotes.unshift(data);
    showAlert('nq-alert',isDraft?'Borrador guardado.':'Cotización guardada.','ok');
    document.getElementById('form-title').textContent=isDraft?'Borrador':'Cotización';
    if(!isDraft) document.getElementById('quote-num-badge').textContent='#'+String(numToUse).padStart(4,'0');
  } catch(e){showAlert('nq-alert','Error: '+e.message,'err');}
};

window.previewQuote = function() {
  const clientId=document.getElementById('q-client').value;
  const client=clients.find(c=>c.id===clientId)||{name:'—',company:'',addr:'',email:''};
  const cur=document.getElementById('q-currency').value||'USD';
  let sub=0;
  const secs=sections.map(s=>{
    const mode=s.mode||'bundle';
    if(mode==='bundle'){sub+=parseFloat(s.price)||0;return {...s,mode};}
    const items=s.items.map((it,i)=>{const el=document.getElementById('amt-'+s.id+'-'+i);const amt=el?parseFloat(el.value)||0:parseFloat(it.amt)||0;sub+=amt;return {...it,amt};});
    return {...s,mode,items};
  });
  const disc=parseFloat(document.getElementById('q-discount').value)||0;
  const taxPct=parseFloat(document.getElementById('q-tax').value)||0;
  const afterDisc=Math.max(0,sub-disc);
  const total=afterDisc+afterDisc*taxPct/100;
  // sync previewCurrency to form currency by default
  previewCurrency=cur;
  updatePreviewCurrencyButtons();
  lastPreviewData={
    number:document.getElementById('quote-num-badge').textContent,
    title:document.getElementById('q-title').value,
    date:document.getElementById('q-date').value,
    validUntil:document.getElementById('q-valid-until').value,
    notes:document.getElementById('q-notes').value,
    client,sections:secs,subtotal:sub,discount:disc,taxPct,total,
    status:document.getElementById('q-status').value,
    currency:cur
  };
  renderPreview(lastPreviewData);
  nav('preview');
};

function fmtDate(d){
  if(!d) return '';
  const [y,m,day]=d.split('-');
  const mo={es:['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
  return `${parseInt(day)} ${mo[lang][parseInt(m)-1]} ${y}`;
}

function buildSectionsHTML(secs, t, cur) {
  return secs.map(s=>{
    const mode=s.mode||'bundle';
    if(mode==='bundle'){
      const acts=(s.activities||[]).filter(a=>a.trim());
      const actRows=acts.map(a=>`
        <tr><td colspan="2" style="padding:4px 0 4px 12px;font-size:13px;color:#555;border-bottom:1px solid #f8f8f8">

              <td style="padding:8px 0;font-size:14px;font-weight:700;border-bottom:2px solid #111">${escH(s.title)}</td>

    } else {
      return `
        <tr><td colspan="4" style="padding:16px 0 6px"><strong style="font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#333">${escH(s.title)}</strong></td></tr>

          <th style="padding:6px 8px;font-size:11px;font-weight:600;color:#999;letter-spacing:.4px;border-bottom:1px solid #eee;text-align:right">${t.qtyCol}</th>
          <th style="padding:6px 8px;font-size:11px;font-weight:600;color:#999;letter-spacing:.4px;border-bottom:1px solid #eee;text-align:right">${t.rateCol}</th>
          <th style="padding:6px 0;font-size:11px;font-weight:600;color:#999;letter-spacing:.4px;border-bottom:1px solid #eee;text-align:right">${t.amtCol}</th>
        </tr>
        ${(s.items||[]).filter(it=>it.desc||it.amt).map(it=>`
        <tr>
          <td style="padding:8px 0;font-size:13px;border-bottom:1px solid #f0f0f0">${escH(it.desc||'')}</td>
          <td style="padding:8px;font-size:13px;border-bottom:1px solid #f0f0f0;text-align:right">${it.qty}</td>
          <td style="padding:8px;font-size:13px;border-bottom:1px solid #f0f0f0;text-align:right">${fmtMoney(it.rate||0,cur)}</td>
          <td style="padding:8px 0;font-size:13px;border-bottom:1px solid #f0f0f0;text-align:right">${fmtMoney(it.amt||0,cur)}</td>
        </tr>`).join('')}`;
    }
  }).join('');
}

// ── DASHBOARD ──
window.renderDashboard = async function() {
  await loadQuotes();
  const total=quotes.length, drafts=quotes.filter(q=>q.status==='draft').length;
  const approved=quotes.filter(q=>q.status==='approved').length;
  const value=quotes.filter(q=>q.status==='approved').reduce((s,q)=>s+(q.total||0),0);
  document.getElementById('stat-total').textContent=total;
  document.getElementById('stat-draft').textContent=drafts;
  document.getElementById('stat-approved').textContent=approved;
  document.getElementById('stat-value').textContent='$'+value.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
  const sLabel={draft:'Borrador',sent:'Enviada',approved:'Aprobada',rejected:'Rechazada'};
  const sClass={draft:'draft',sent:'sent',approved:'approved',rejected:'rejected'};
  const list=document.getElementById('quotes-list');
  if(!quotes.length){list.innerHTML='<p style="color:#999;font-size:14px;padding:16px 0">Sin cotizaciones aún.</p>';return;}
  list.innerHTML=quotes.slice(0,20).map(q=>`
    <div class="quote-item" onclick="openQuote('${q.id}')">
      <div class="qi-left">
        <div class="num">${escH(q.number||'Borrador')}${q.title?' — '+escH(q.title):''}</div>
        <div class="client">${escH(q.clientCompany||q.clientName||'Sin cliente')}${q.currency&&q.currency!=='USD'?` · <strong>${q.currency}</strong>`:''}</div>
      </div>
      <div class="qi-right">
        <span class="badge badge-${sClass[q.status]||'draft'}">${sLabel[q.status]||q.status}</span>
        <span class="qi-amt">${fmtMoney(q.total||0, q.currency||'USD')}</span>
      </div>
    </div>`).join('');
};

window.openQuote = function(qid) {
  const q=quotes.find(x=>x.id===qid);
  if(!q) return;
  editingQuoteId=qid;
  document.getElementById('form-title').textContent=q.status==='draft'?'Borrador':'Cotización';
  document.getElementById('quote-num-badge').textContent=q.number||'BORRADOR';
  document.getElementById('q-client').value=q.clientId||'';
  document.getElementById('q-date').value=q.date||'';
  document.getElementById('q-valid-until').value=q.validUntil||'';
  document.getElementById('q-title').value=q.title||'';
  document.getElementById('q-status').value=q.status||'draft';
  document.getElementById('q-notes').value=q.notes||'';
  document.getElementById('q-discount').value=q.discount||0;
  document.getElementById('q-tax').value=q.taxPct||0;
  const cur=q.currency||'USD';
  document.getElementById('q-currency').value=cur;
  document.getElementById('disc-currency-label').textContent=cur;
  currency=cur;
  sections=(q.sections||[{id:'s0',title:'Servicios',mode:'bundle',price:0,activities:['']}]).map(s=>({
    ...s,
    id:s.id||('s'+Date.now()+Math.random()),
    mode:s.mode||'bundle',
    price:s.price||0,
    activities:s.activities||[''],
    items:s.items||[{desc:'',qty:1,rate:0,amt:0}]
  }));
  renderSections();
  setTimeout(calcTotals,50);
  nav('new-quote');
};

// ── CLIENTS ──
window.saveClient = async function() {
  const name=document.getElementById('c-name').value.trim();
  if(!name) return;
  const data={name,company:document.getElementById('c-company').value.trim(),email:document.getElementById('c-email').value.trim(),addr:document.getElementById('c-addr').value.trim()};
  const cid='c'+Date.now();
  await setDoc(doc(db,'clients',cid),data);
  clients.push({id:cid,...data});
  const sel=document.getElementById('q-client');
  const o=document.createElement('option');o.value=cid;o.textContent=data.company?`${data.name} — ${data.company}`:data.name;sel.appendChild(o);
  ['c-name','c-company','c-email','c-addr'].forEach(id=>document.getElementById(id).value='');
  renderClients();
};
window.renderClients = function() {
  const list=document.getElementById('clients-list');
  if(!clients.length){list.innerHTML='<p style="color:#999;font-size:14px">Sin clientes aún.</p>';return;}
  list.innerHTML='<h2 style="margin-bottom:16px">Clientes guardados</h2>'+clients.map(c=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0">
      <div><strong>${escH(c.name)}</strong>${c.company?` — <span style="color:#666">${escH(c.company)}</span>`:''} ${c.email?`<br><span style="font-size:12px;color:#888">${escH(c.email)}</span>`:''}</div>
      <button class="btn btn-secondary btn-sm" onclick="deleteClient('${c.id}')">Eliminar</button>
    </div>`).join('');
};
window.deleteClient = async function(cid) {
  if(!confirm('¿Eliminar cliente?')) return;
  await deleteDoc(doc(db,'clients',cid));
  clients=clients.filter(c=>c.id!==cid);
  renderClients();
};

// ── SETTINGS ──
window.saveSettings = async function() {
  settings={...settings,nextNum:parseInt(document.getElementById('s-next-num').value)||1,prefix:document.getElementById('s-prefix').value||'Q-',brand:document.getElementById('s-brand').value,email:document.getElementById('s-email').value,phone:document.getElementById('s-phone').value,web:document.getElementById('s-web').value,addr:document.getElementById('s-addr').value};
  await setDoc(doc(db,'config','quote_settings'),settings);
  alert('Ajustes guardados.');
};

// ── UTILS ──
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showAlert(id,msg,type){const el=document.getElementById(id);el.textContent=msg;el.className='alert '+type;el.style.display='block';setTimeout(()=>el.style.display='none',4000);}

init();
</script>
